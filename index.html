<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Jumper</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #5c94fc 0%, #7db9ff 60%, #a3d4ff 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    overflow: hidden;
  }
  h1 {
    margin: 10px 0 4px;
    font-size: 28px;
    letter-spacing: 2px;
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 18px;
    margin-bottom: 8px;
  }
  #gameWrap {
    position: relative;
    border: 6px solid #222;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    background: #7db9ff;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    text-align: center;
  }
  #overlay button {
    margin-top: 16px;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #f8c400;
    color: #222;
    text-shadow: none;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay button:hover { background: #ffd633; }
  #controls {
    margin-top: 10px;
    font-size: 13px;
    opacity: 0.85;
    text-align: center;
  }
</style>
</head>
<body>

<h1>🍄 PIXEL JUMPER 🍄</h1>
<div id="hud">
  <div>Score: <span id="score">0</span></div>
  <div>Lives: <span id="lives">3</span></div>
  <div>Coins: <span id="coins">0</span>/<span id="totalCoins">0</span></div>
</div>

<div id="gameWrap">
  <canvas id="game" width="900" height="500"></canvas>
  <div id="overlay">
    <div id="overlayText">Game Over</div>
    <button id="overlayBtn">Restart</button>
  </div>
</div>

<div id="controls">
  ← → or A/D to move &nbsp;|&nbsp; Space / ↑ / W to jump (hold for higher jump) &nbsp;|&nbsp; Stomp enemies from above!
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GRAVITY = 0.6;
const FRICTION = 0.8;
const MOVE_SPEED = 4.2;
const JUMP_VELOCITY = -13;
const GROUND_Y = H - 60;

// ---------- Level data ----------
// Platforms: x, y, w, h
const level = {
  width: 3600,
  platforms: [
    // ground segments (with gaps/pits)
    {x:0, y:GROUND_Y, w:700, h:60},
    {x:800, y:GROUND_Y, w:400, h:60},
    {x:1300, y:GROUND_Y, w:300, h:60},
    {x:1700, y:GROUND_Y, w:600, h:60},
    {x:2400, y:GROUND_Y, w:250, h:60},
    {x:2750, y:GROUND_Y, w:850, h:60},

    // floating platforms
    {x:300, y:360, w:110, h:22},
    {x:520, y:280, w:110, h:22},
    {x:900, y:340, w:130, h:22},
    {x:1100, y:250, w:110, h:22},
    {x:1350, y:330, w:100, h:22},
    {x:1550, y:250, w:100, h:22},
    {x:1850, y:340, w:130, h:22},
    {x:2050, y:260, w:110, h:22},
    {x:2250, y:200, w:110, h:22},
    {x:2500, y:330, w:110, h:22},
    {x:2900, y:320, w:120, h:22},
    {x:3100, y:250, w:120, h:22},
    {x:3300, y:340, w:130, h:22},
  ],
  coins: [
    {x:340,y:320},{x:560,y:240},{x:940,y:300},{x:1140,y:210},
    {x:1390,y:290},{x:1590,y:210},{x:1890,y:300},{x:2090,y:220},
    {x:2290,y:160},{x:2540,y:290},{x:2940,y:280},{x:3140,y:210},
    {x:3340,y:300},{x:850,y:GROUND_Y-30},{x:1450,y:GROUND_Y-30},
    {x:2000,y:GROUND_Y-30},{x:2850,y:GROUND_Y-30}
  ],
  enemies: [
    {x:900, y:GROUND_Y-30, minX:820, maxX:1150},
    {x:1750, y:GROUND_Y-30, minX:1720, maxX:2150},
    {x:2450, y:GROUND_Y-30, minX:2420, maxX:2600},
    {x:2900, y:GROUND_Y-30, minX:2780, maxX:3550},
  ],
  flagX: 3520
};

document.getElementById('totalCoins').textContent = level.coins.length;

// ---------- Entities ----------
const player = {
  x: 40, y: GROUND_Y-40, w: 30, h: 40,
  vx: 0, vy: 0, onGround: false, facing: 1,
  alive: true, invuln: 0
};

let coins = level.coins.map(c => ({...c, taken:false}));
let enemies = level.enemies.map(e => ({...e, x0:e.x, dir:1, alive:true, w:28, h:26}));

let camX = 0;
let score = 0, lives = 3, coinCount = 0;
let gameState = 'playing'; // playing, win, dead
let keys = {};

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function resetGame(){
  player.x = 40; player.y = GROUND_Y-40; player.vx=0; player.vy=0; player.alive=true; player.invuln=0;
  coins = level.coins.map(c => ({...c, taken:false}));
  enemies = level.enemies.map(e => ({...e, x0:e.x, dir:1, alive:true, w:28, h:26}));
  score = 0; lives = 3; coinCount = 0; camX = 0;
  gameState = 'playing';
  document.getElementById('overlay').style.display = 'none';
  updateHUD();
}

function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('coins').textContent = coinCount;
}

function loseLife(){
  lives--;
  updateHUD();
  if (lives <= 0){
    gameState = 'dead';
    showOverlay('💀 Game Over', 'Restart');
  } else {
    player.x = Math.max(40, camX + 40);
    player.y = GROUND_Y - 40;
    player.vx = 0; player.vy = 0;
    player.invuln = 90;
  }
}

function showOverlay(text, btnText){
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('overlayText').textContent = text;
  document.getElementById('overlayBtn').textContent = btnText;
}

document.getElementById('overlayBtn').addEventListener('click', resetGame);

function update(){
  if (gameState !== 'playing') return;

  // horizontal movement
  if (keys['arrowleft'] || keys['a']){ player.vx -= 1.1; player.facing = -1; }
  if (keys['arrowright'] || keys['d']){ player.vx += 1.1; player.facing = 1; }
  player.vx *= FRICTION;
  if (Math.abs(player.vx) > MOVE_SPEED) player.vx = MOVE_SPEED * Math.sign(player.vx);
  if (Math.abs(player.vx) < 0.05) player.vx = 0;

  // jump
  if ((keys['arrowup'] || keys['w'] || keys[' ']) && player.onGround){
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
  }

  // gravity
  player.vy += GRAVITY;
  if (player.vy > 16) player.vy = 16;

  // move + collide X
  player.x += player.vx;
  player.onGround = false;
  for (const p of level.platforms){
    if (rectsOverlap(player, p)){
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // move + collide Y
  player.y += player.vy;
  for (const p of level.platforms){
    if (rectsOverlap(player, p)){
      if (player.vy > 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0){
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // fell into a pit
  if (player.y > H + 100){
    loseLife();
    return;
  }

  // bounds
  if (player.x < 0) player.x = 0;
  if (player.x > level.width - player.w) player.x = level.width - player.w;

  if (player.invuln > 0) player.invuln--;

  // coins
  for (const c of coins){
    if (!c.taken){
      const cRect = {x:c.x-10, y:c.y-10, w:20, h:20};
      const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
      if (rectsOverlap(cRect, pRect)){
        c.taken = true;
        coinCount++;
        score += 100;
        updateHUD();
      }
    }
  }

  // enemies
  for (const e of enemies){
    if (!e.alive) continue;
    e.x += e.dir * 1.6;
    if (e.x < e.minX || e.x + e.w > e.maxX) e.dir *= -1;

    const eRect = {x:e.x, y:e.y, w:e.w, h:e.h};
    const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
    if (rectsOverlap(eRect, pRect)){
      const playerBottom = player.y + player.h;
      const stomping = player.vy > 0 && playerBottom - eRect.h/2 < eRect.y + 14;
      if (stomping){
        e.alive = false;
        player.vy = JUMP_VELOCITY * 0.6;
        score += 200;
        updateHUD();
      } else if (player.invuln === 0){
        loseLife();
        return;
      }
    }
  }

  // win condition
  if (player.x + player.w >= level.flagX){
    gameState = 'win';
    score += lives * 100 + coinCount * 50;
    updateHUD();
    showOverlay('🏁 Level Complete! Score: ' + score, 'Play Again');
  }

  // camera
  camX = player.x - W/2 + player.w/2;
  if (camX < 0) camX = 0;
  if (camX > level.width - W) camX = level.width - W;
}

// ---------- Drawing ----------
function drawBackground(){
  ctx.fillStyle = '#7db9ff';
  ctx.fillRect(0,0,W,H);

  // parallax hills/clouds
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i=0;i<8;i++){
    const cx = ((i*420) - camX*0.3) % (level.width+400);
    drawCloud(cx, 60 + (i%3)*30);
  }
  ctx.fillStyle = '#4caf50';
  for (let i=0;i<10;i++){
    const hx = ((i*400) - camX*0.5) % (level.width+400);
    ctx.beginPath();
    ctx.arc(hx, GROUND_Y+40, 90, Math.PI, 0);
    ctx.fill();
  }
}

function drawCloud(x,y){
  ctx.beginPath();
  ctx.arc(x,y,18,0,Math.PI*2);
  ctx.arc(x+18,y-8,20,0,Math.PI*2);
  ctx.arc(x+38,y,18,0,Math.PI*2);
  ctx.fill();
}

function drawPlatforms(){
  for (const p of level.platforms){
    const sx = p.x - camX;
    if (sx + p.w < 0 || sx > W) continue;
    // dirt/brick body
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(sx, p.y, p.w, p.h);
    // grassy top
    ctx.fillStyle = '#5cd65c';
    ctx.fillRect(sx, p.y, p.w, 10);
    // brick lines
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    for (let bx = 0; bx < p.w; bx += 20){
      ctx.beginPath();
      ctx.moveTo(sx+bx, p.y+10);
      ctx.lineTo(sx+bx, p.y+p.h);
      ctx.stroke();
    }
  }
}

function drawCoins(){
  for (const c of coins){
    if (c.taken) continue;
    const sx = c.x - camX;
    if (sx < -20 || sx > W+20) continue;
    ctx.save();
    ctx.translate(sx, c.y);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(0,0, 9, 11, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

function drawEnemies(){
  for (const e of enemies){
    if (!e.alive) continue;
    const sx = e.x - camX;
    if (sx + e.w < 0 || sx > W) continue;
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.ellipse(sx+e.w/2, e.y+e.h/2, e.w/2, e.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx+5, e.y+6, 6, 6);
    ctx.fillRect(sx+e.w-11, e.y+6, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(sx+7, e.y+8, 2, 2);
    ctx.fillRect(sx+e.w-9, e.y+8, 2, 2);
    // feet
    ctx.fillStyle = '#5a2e0d';
    ctx.fillRect(sx+2, e.y+e.h-4, 8, 6);
    ctx.fillRect(sx+e.w-10, e.y+e.h-4, 8, 6);
  }
}

function drawFlag(){
  const sx = level.flagX - camX;
  ctx.fillStyle = '#ccc';
  ctx.fillRect(sx, GROUND_Y-260, 6, 260);
  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath();
  ctx.moveTo(sx+6, GROUND_Y-250);
  ctx.lineTo(sx+50, GROUND_Y-235);
  ctx.lineTo(sx+6, GROUND_Y-220);
  ctx.closePath();
  ctx.fill();
}

function drawPlayer(){
  const sx = player.x - camX;
  if (player.invuln > 0 && Math.floor(player.invuln/5)%2===0) return; // blink

  ctx.save();
  ctx.translate(sx, player.y);
  if (player.facing < 0){ ctx.translate(player.w,0); ctx.scale(-1,1); }

  // legs
  ctx.fillStyle = '#2255cc';
  ctx.fillRect(4, 28, 9, 12);
  ctx.fillRect(17, 28, 9, 12);
  // body/overalls
  ctx.fillStyle = '#2255cc';
  ctx.fillRect(2, 16, 26, 16);
  // shirt sleeves
  ctx.fillStyle = '#e83b3b';
  ctx.fillRect(0, 14, 8, 10);
  ctx.fillRect(22, 14, 8, 10);
  // head
  ctx.fillStyle = '#f2c29a';
  ctx.fillRect(6, 4, 18, 14);
  // cap
  ctx.fillStyle = '#e83b3b';
  ctx.fillRect(4, 0, 22, 6);
  ctx.fillRect(20, 4, 8, 4);
  // eye
  ctx.fillStyle = '#000';
  ctx.fillRect(18, 10, 3, 3);
  // mustache
  ctx.fillStyle = '#5a3311';
  ctx.fillRect(12, 13, 10, 3);

  ctx.restore();
}

function draw(){
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawFlag();
  drawEnemies();
  drawPlayer();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
